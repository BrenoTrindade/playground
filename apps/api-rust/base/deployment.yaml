apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
  namespace: apps
  labels:
    app: api-rust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api-rust
          image: api-rust:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres.storage.svc.cluster.local:5432/ledger_db"
            - name: PORT
              value: "3000"
            - name: RUST_LOG
              value: "info,api_rust=debug"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust
  namespace: apps
  labels:
    app: api-rust
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: api-rust
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-rust
  namespace: apps
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/ledger(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-rust
                port:
                  number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-rust-pdb
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-rust
