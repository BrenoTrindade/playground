name: CI GitOps Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  kubeconform:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: '0.7.0'

      - name: Run Kubeconform
        run: |
          kubeconform -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            clusters/ infrastructure/ apps/

      - name: Validate Kustomize builds
        run: |
          kubectl kustomize infrastructure/local
          kubectl kustomize apps/local

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "infrastructure/ apps/ clusters/"
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable
              document-start: disable
